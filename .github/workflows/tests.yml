name: Tests

on:
  push:
    branches: [ dev ]
    paths-ignore:
      - 'doc/**'
      - 'app/eventyay/locale/**'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'doc/**'
      - 'app/eventyay/locale/**'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventyay
          POSTGRES_PASSWORD: eventyay
          POSTGRES_DB: eventyay-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eventyay -d eventyay-db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      EVY_POSTGRES_USER: eventyay
      EVY_POSTGRES_PASSWORD: eventyay
      EVY_POSTGRES_DB: eventyay-db
      EVY_POSTGRES_HOST: localhost
      EVY_POSTGRES_PORT: '5432'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install Python dependencies
        run: uv sync --group test
      - name: Compile translations
        run: uv run python manage.py compilemessages
      - name: Run tests
        # Tests in tests/known_failures.txt already fail on dev and are deselected;
        # everything else must pass.
        run: uv run pytest tests/ -n 3 -p no:sugar --skip-known-failures
