# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  auto_review:
    enabled: true
    drafts: true

  path_instructions:
    - path: "**/*"
      instructions: |
        Treat `agents.md` as the canonical policy file for this repository.
        Verify every pull request follows the applicable requirements in that file.

    - path: "**/*"
      instructions: |
        For each changed file, load every applicable file-specific instruction in `.github/instructions/*.md` according to its `applyTo` pattern.
        Confirm the pull request follows all matched instruction files and call out violations explicitly.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "agents.md"
