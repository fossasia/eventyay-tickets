{% load i18n %}
{% load safelink %}
{% load privacy_consent %}

{% if core_footer_links %}
<nav class="core-footer-nav" aria-label="{% translate 'Platform links' %}">
    <div class="core-footer-links-container">
        {% for link in core_footer_links %}
            <a href="{% safelink link.url %}"
               class="core-footer-link"
               {% if link.target_blank %}target="_blank" rel="noopener"{% endif %}>
                {{ link.label }}
            </a>
        {% endfor %}
    </div>
</nav>
{% endif %}

{% consent_provider as provider %}
{% if provider == 'klaro' %}
    <nav class="core-footer-nav" aria-label="{% translate 'Privacy' %}">
        <div class="core-footer-links-container">
            <a href="#" class="core-footer-link" data-privacy-settings>{% translate "Privacy settings" %}</a>
        </div>
    </nav>
{% endif %}
